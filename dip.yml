version: '7.1'

# Define default environment variables to pass
# to Docker Compose
environment:
  RAILS_ENV: development
  DEV_NAMESPACE: dev

compose:
  files:
    - .dockerdev/docker-compose.yml
  project_name: nasa-missions

kubectl:
  namespace: nasa-missions-$DEV_NAMESPACE

interaction:
  # This command spins up a Rails container with the required dependencies (such as databases)
  # and opens a terminal within it.
  runner:
    description: Open a Bash shell within a Rails container (with dependencies up)
    service: rails
    command: /bin/bash

  # Run a Rails container without any dependent services (useful for non-Rails scripts)
  bash:
    description: Run an arbitrary script within a container (or open a shell without deps)
    service: rails
    command: /bin/bash
    compose_run_options: [ no-deps ]

  # A shortcut to run Bundler commands
  bundle:
    description: Run Bundler commands
    service: rails
    command: bundle
    compose_run_options: [ no-deps ]

  # A shortcut to run RSpec (which overrides the RAILS_ENV)
  rspec:
    description: Run RSpec commands
    service: rails
    environment:
      RAILS_ENV: test
    command: bundle exec rspec

  rspec_parallel:
    description: Run RSpec commands in parallel
    service: rails
    environment:
      RAILS_ENV: test
    command: |
      bundle exec rake parallel:spec

  rspec_parallel_prepare_db:
    description: Prepare the database for parallel RSpec tests
    service: rails
    environment:
      RAILS_ENV: test
    command: |
      bundle exec rake parallel:drop
      bundle exec rake parallel:create
      bundle exec rake parallel:migrate

  rubocop:
    description: Run Rubocop commands
    service: rails
    command: bundle exec rubocop

  rails:
    description: Run Rails commands
    service: rails
    command: bundle exec rails
    subcommands:
      s:
        description: Run Rails server at http://localhost:3000
        service: web
        compose:
          run_options: [service-ports, use-aliases]

  psql:
    description: Run Postgres psql console
    service: postgres
    default_args: nasa_missions_development
    command: psql -h postgres -U postgres

  'redis-cli':
    description: Run Redis console
    service: redis
    command: redis-cli -h redis

  yarn:
    description: Run Yarn commands
    service: rails
    command: yarn
    compose_run_options: [ no-deps ]

provision:
  - (test -f .env) || (cp .env.example .env)
  - (test -f .dockerdev/.bashrc) || (cp .dockerdev/.bashrc.example .dockerdev/.bashrc)
  - (test -f .dockerdev/.pryrc) || (cp .dockerdev/.pryrc.example .dockerdev/.pryrc)
  - (test -f .dockerdev/.psqlrc) || (cp .dockerdev/.psqlrc.example .dockerdev/.psqlrc)
  - (test -f .rspec) || (cp .rspec.example .rspec)
  - (test -f config/database.yml) || (cp config/database.yml.example config/database.yml)
  # - (test -f config/database.yml) || (cp .dockerdev/database.yml.example config/database.yml)
  # We need the `|| true` part because some docker-compose versions
  # cannot down a non-existent container without an error,
  # see https://github.com/docker/compose/issues/9426
  - dip compose down || true
  - dip compose up -d postgres redis
  - dip bundle install
  - dip yarn install --frozen-lockfile
  - dip yarn build:css
  - dip rails db:prepare
  - dip compose up -d web sidekiq css
