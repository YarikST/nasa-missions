name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  RAILS_ENV: test
  NODE_ENV: test

  BUNDLE_PATH: vendor/bundle
  BUNDLE_WITHOUT: production

jobs:
  rspec:
    name: RSpec ${{ matrix.group }}/2
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        group: [ 1, 2 ]

    container:
      image: public.ecr.aws/docker/library/ruby:4.0.4

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18.1-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nasa_missions_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 25

      redis:
        image: public.ecr.aws/docker/library/redis:7.2.3-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PARALLEL_TEST_GROUPS: 2
      PARALLEL_TEST_PROCESS_NUMBER: ${{ matrix.group }}

      PG_HOST: postgres
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_PORT: 5432

      REDIS_URL: redis://redis:6379/0
      SIDEKIQ_REDIS_URL: redis://redis:6379/1
      CACHE_REDIS_URL: redis://redis:6379/2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore Bundler cache
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: bundler-${{ runner.os }}-${{ runner.arch }}-ruby-4.0.4-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            bundler-${{ runner.os }}-${{ runner.arch }}-ruby-4.0.4-

      - name: Install gems
        run: |
          apt-get update -y
          apt-get install --no-install-recommends -y \
            build-essential \
            git \
            libpq-dev \
            libvips42
          
          rm -rf /var/lib/apt/lists/*
          
          echo "gem: --no-document" > ~/.gemrc
          
          bundle config set path "$BUNDLE_PATH"
          bundle config set without "$BUNDLE_WITHOUT"
          bundle config set specific_platform true
          bundle config set deployment true
          
          bundle check || bundle install --jobs=4 --retry=3
          
          rm -rf vendor/bundle/ruby/*/cache
          rm -rf vendor/bundle/ruby/*/doc
          
          bundle clean --force
          
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build stylesheets for rendered pages
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile
          yarn build:css

      - name: Prepare PostgreSQL database
        run: |
          ./bin/rails db:drop
          ./bin/rails db:create
          ./bin/rails db:migrate

      - name: Run RSpec tests — group ${{ matrix.group }}/2
        run: |
          bundle exec parallel_rspec spec/ \
            -n "$PARALLEL_TEST_GROUPS" \
            --only-group "$PARALLEL_TEST_PROCESS_NUMBER" \
            --test-options "
              --format progress
              --force-color
            "

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest

    container:
      image: public.ecr.aws/docker/library/ruby:4.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update -y
          apt-get install --no-install-recommends -y \
            build-essential \
            git \
            libpq-dev
          
          rm -rf /var/lib/apt/lists/*
          
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore Bundler cache
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: bundler-${{ runner.os }}-${{ runner.arch }}-ruby-4.0.4-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            bundler-${{ runner.os }}-${{ runner.arch }}-ruby-4.0.4-

      - name: Install gems
        run: |
          echo "gem: --no-document" > ~/.gemrc
          
          bundle config set path "$BUNDLE_PATH"
          bundle config set without "$BUNDLE_WITHOUT"
          bundle config set specific_platform true
          bundle config set deployment true
          
          bundle check || bundle install --jobs=4 --retry=3

      - name: Run RuboCop
        run: bundle exec rubocop --parallel

  brakeman:
    name: Brakeman
    runs-on: ubuntu-latest

    container:
      image: public.ecr.aws/docker/library/ruby:4.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update -y
          apt-get install --no-install-recommends -y \
            build-essential \
            git \
            libpq-dev
          
          rm -rf /var/lib/apt/lists/*
          
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore Bundler cache
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: bundler-${{ runner.os }}-${{ runner.arch }}-ruby-4.0.4-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            bundler-${{ runner.os }}-${{ runner.arch }}-ruby-4.0.4-

      - name: Install gems
        run: |
          echo "gem: --no-document" > ~/.gemrc
          
          bundle config set path "$BUNDLE_PATH"
          bundle config set without "$BUNDLE_WITHOUT"
          bundle config set specific_platform true
          bundle config set deployment true
          
          bundle check || bundle install --jobs=4 --retry=3

      - name: Run Brakeman
        run: bundle exec brakeman --no-pager
